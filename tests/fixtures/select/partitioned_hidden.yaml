# Alice sees one partition's rows of three (events) and of two (readings). With `ctid` alone the
# rows she sees stood for the ones she doesn't, and `select: all` passed.
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [partitioned.sql]
vars:
  tenant_a: 00000000-0000-4000-8000-00000000000a
identities:
  alice: { role: app, gucs: { app.tenant_id: "${tenant_a}" } }
unspecified: ignore
expect:
  events:
    alice:
      select: all
  readings:
    alice:
      select: all
