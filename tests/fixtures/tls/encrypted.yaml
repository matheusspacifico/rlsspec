# Runs only if the session is encrypted (see encrypted.sql). db.rlsspec.test is reached through hostaddr=127.0.0.1.
version: 1
database: { url: "${env:DATABASE_URL}" }
safety: { allowed_hosts: [db.rlsspec.test] }
setup: [encrypted.sql]
identities:
  alice: { role: app }
defaults:
  alice:
    "*": { select: deny, insert: deny, update: deny, delete: deny }
