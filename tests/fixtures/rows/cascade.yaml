# A cascade deletes a row of the same table that the statement didn't: inconclusive, with or without `subset`.
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [../writes/schema.sql, tenant_write.sql, cascade.sql]
vars:
  tenant_a: 00000000-0000-4000-8000-00000000000a
  tenant_b: 00000000-0000-4000-8000-00000000000b
  alice: 00000000-0000-4000-8000-0000000a11ce
identities:
  alice: { role: app, gucs: { app.tenant_id: "${tenant_a}", app.user_id: "${alice}" } }
  guest: { role: web_anon }
unspecified: ignore
expect:
  notes:
    alice:
      delete:
        - { rows: "tenant_id = ${tenant_a}" }
        - { rows: "tenant_id = ${tenant_a}", subset: true }
