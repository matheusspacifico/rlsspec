# A trigger changes another row of the same table: more rows changed than the statement affected, so the affected rows can't be identified.
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [../writes/schema.sql, tenant_write.sql, trigger_same_table.sql]
vars:
  tenant_a: 00000000-0000-4000-8000-00000000000a
  tenant_b: 00000000-0000-4000-8000-00000000000b
  alice: 00000000-0000-4000-8000-0000000a11ce
identities:
  alice: { role: app, gucs: { app.tenant_id: "${tenant_a}", app.user_id: "${alice}" } }
  guest: { role: web_anon }
unspecified: ignore
expect:
  notes:
    alice:
      update: { set: { body: "x" }, rows: "tenant_id = ${tenant_a}" }
