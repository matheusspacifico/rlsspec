version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [../select/schema.sql, ../select/rows_pass.sql]
vars:
  tenant_a: 00000000-0000-4000-8000-00000000000a
identities:
  alice: { role: app, gucs: { app.tenant_id: "${tenant_a}" } }
defaults:
  alice:
    "*": { update: deny }
expect:
  notes:
    alice:
      select: { rows: "tenant_id = ${tenant_a}" }
      insert:
        - { values: { id: 7, tenant_id: "${tenant_a}" }, expect: allow }
      delete: deny
