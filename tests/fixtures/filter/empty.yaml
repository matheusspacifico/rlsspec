# Without `on_empty`, the filtered default is vacuous on the empty table and the message names its key.
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [schema.sql]
vars:
  tenant_a: 00000000-0000-4000-8000-00000000000a
identities:
  alice: { role: app, gucs: { app.tenant_id: "${tenant_a}" } }
unspecified: ignore
defaults:
  alice:
    "*[tenant_id]": { select: { rows: "tenant_id = ${tenant_a}" } }
