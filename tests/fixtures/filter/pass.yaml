# One block for every tenant table; `*` covers the rest. labels is empty and skipped; plans has no tenant_id and gets the `*` default.
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [schema.sql]
vars:
  tenant_a: 00000000-0000-4000-8000-00000000000a
identities:
  alice: { role: app, gucs: { app.tenant_id: "${tenant_a}" } }
unspecified: warn
defaults:
  alice:
    # Never read or touch another tenant, once, for every table that has tenant_id. Setting tenant_id
    # to her own tenant changes nothing on her rows and satisfies a correct WITH CHECK.
    "*[tenant_id]":
      select: { rows: "tenant_id = ${tenant_a}" }
      update: { set: { tenant_id: "${tenant_a}" }, rows: "tenant_id = ${tenant_a}" }
      delete: { rows: "tenant_id = ${tenant_a}" }
      on_empty: skip
    "*": { select: all, update: deny, delete: deny }
