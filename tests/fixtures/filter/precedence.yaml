# Precedence per operation: expect, then a named default, then `*[…]`, then `*`.
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [schema.sql]
vars:
  tenant_a: 00000000-0000-4000-8000-00000000000a
identities:
  alice: { role: app, gucs: { app.tenant_id: "${tenant_a}" } }
unspecified: ignore
defaults:
  alice:
    "*": { select: all }
    "*[tenant_id, project_id]": { delete: { rows: "tenant_id = ${tenant_a}" } }
    "*[ tenant_id ]": { select: { rows: "tenant_id = ${tenant_a}" }, on_empty: skip }
    tasks: { select: { rows: "project_id = 1" } }
expect:
  projects:
    alice: { select: { rows: "name = 'apollo'" } }
