# notes and tags have rows, drafts has none: without `on_empty`, the blanket defaults are vacuous there (exit 2).
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [../writes/schema.sql, ../writes/empty.sql]
identities:
  alice: { role: app, gucs: { app.tenant_id: 00000000-0000-4000-8000-00000000000a } }
  guest: { role: web_anon }
unspecified: warn
defaults:
  guest:
    "*": { select: deny, insert: deny, update: deny, delete: deny }
  alice:
    "*": { delete: deny }
