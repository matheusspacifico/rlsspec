# `on_empty: skip` is about empty tables only: a predicate matching nothing on a table that has rows stays inconclusive.
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [../writes/schema.sql, ../writes/empty.sql]
identities:
  alice: { role: app, gucs: { app.tenant_id: 00000000-0000-4000-8000-00000000000a } }
  guest: { role: web_anon }
unspecified: warn
defaults:
  guest:
    "*": { select: deny, insert: deny, update: deny, delete: deny, on_empty: skip }
  alice:
    "*": { update: [{ where: "id < 0", expect: deny }], on_empty: skip }
