# Skipping the empty table hides nothing on the others: a catch-all policy for guest still fails on notes.
version: 1
database: { url: "${env:DATABASE_URL}" }
setup: [../writes/schema.sql, ../writes/empty.sql, ../writes/guest_all_true.sql]
identities:
  alice: { role: app, gucs: { app.tenant_id: 00000000-0000-4000-8000-00000000000a } }
  guest: { role: web_anon }
unspecified: warn
defaults:
  guest:
    "*": { select: deny, insert: deny, update: deny, delete: deny, on_empty: skip }
  alice:
    "*": { delete: deny, on_empty: skip }
