[package]
name = "rlsspec"
version = "0.1.0"
edition = "2024"
description = "Check Postgres Row Level Security against a spec of expected access"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["postgres", "rls", "security", "testing", "cli"]
categories = ["command-line-utilities", "database", "development-tools::testing"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
thiserror = "2"
anyhow = "1"
postgres = "0.19"

[dev-dependencies]
insta = "1.48"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "blocking"] }
