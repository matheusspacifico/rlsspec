[package]
name = "rlsspec"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Check Postgres Row Level Security against a spec of expected access"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/matheusspacifico/rlsspec"
homepage = "https://github.com/matheusspacifico/rlsspec"
documentation = "https://github.com/matheusspacifico/rlsspec#readme"
keywords = ["postgres", "rls", "security", "testing", "cli"]
categories = ["command-line-utilities", "database", "development-tools::testing"]
include = [
    "/src/**/*.rs",
    "/src/**/*.snap",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
thiserror = "2"
anyhow = "1"
postgres = "0.19"
anstream = "1"
anstyle = "1"
serde_json = "1"
quick-junit = "0.8"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
insta = "1.48"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "blocking"] }
