# Who may do what in the project tracker. Every identity × table × operation is specified.
version: 1

database:
  url: ${env:DATABASE_URL}
  schemas: [public]

setup:
  - seed.sql

vars:
  acme: 0e5e0000-0000-4000-8000-00000000ac3e
  globex: 0e5e0000-0000-4000-8000-0000000610be
  ana: a5e40000-0000-4000-8000-000000000a0a       # Acme admin
  ben: a5e40000-0000-4000-8000-000000000b0b       # Acme member
  cleo: a5e40000-0000-4000-8000-000000000c0c      # Globex admin
  newcomer: a5e40000-0000-4000-8000-000000000d0d  # not a member anywhere yet
  acme_roadmap: 9a0e0000-0000-4000-8000-000000000002
  globex_launch: 9a0e0000-0000-4000-8000-000000000003

identities:
  anon:
    role: app_anon
  ana:
    role: app_user
    gucs: { app.org_id: "${acme}", app.user_id: "${ana}" }
  ben:
    role: app_user
    gucs: { app.org_id: "${acme}", app.user_id: "${ben}" }
  cleo:
    role: app_user
    gucs: { app.org_id: "${globex}", app.user_id: "${cleo}" }

defaults:
  anon:
    "*": { select: deny, insert: deny, update: deny, delete: deny }
  ana:
    "*": { select: { rows: "org_id = ${acme}" } }
    organizations: { select: { rows: "id = ${acme}" }, insert: deny, delete: deny }
    memberships: { update: deny }
  ben:
    "*": { select: { rows: "org_id = ${acme}" } }
    organizations: { select: { rows: "id = ${acme}" }, insert: deny, delete: deny }
    memberships: { update: deny }
  cleo:
    "*": { select: { rows: "org_id = ${globex}" } }
    organizations: { select: { rows: "id = ${globex}" }, insert: deny, delete: deny }
    memberships: { update: deny }

# `rows` on update and delete: the statement runs over the whole table and must touch exactly those
# rows. It reads no column, so the SELECT policies can't hide a write policy that is too wide.
# Setting org_id to the identity's own organization is a constant that changes nothing on its rows.
expect:
  organizations:
    ana:
      update: { set: { name: "Acme Inc" }, rows: "id = ${acme}" }   # admins rename their own organization only
    ben:
      update: deny                              # members can't rename it
    cleo:
      update: { set: { name: "Globex Inc" }, rows: "id = ${globex}" }

  memberships:
    ana:
      insert:
        - { values: { org_id: "${acme}", user_id: "${newcomer}", role: member }, expect: allow }
        - { values: { org_id: "${globex}", user_id: "${newcomer}", role: member }, expect: deny }
      delete:
        - { where: "org_id = ${acme} and user_id = ${ben}", expect: allow }
        - { where: "org_id = ${globex}", expect: deny }
    ben:
      insert:                                   # members can't invite
        - { values: { org_id: "${acme}", user_id: "${newcomer}", role: member }, expect: deny }
      delete: deny
    cleo:
      insert:
        - { values: { org_id: "${globex}", user_id: "${newcomer}", role: admin }, expect: allow }
        - { values: { org_id: "${acme}", user_id: "${newcomer}", role: admin }, expect: deny }
      delete:
        - { where: "org_id = ${globex}", expect: allow }
        - { where: "org_id = ${acme}", expect: deny }

  projects:
    anon:
      select: { rows: "is_public" }             # public projects of every organization
    ana:
      insert:
        - { values: { org_id: "${acme}", name: "Hiring" }, expect: allow }
        - { values: { org_id: "${globex}", name: "Hiring" }, expect: deny }
      update:
        - { set: { org_id: "${acme}" }, rows: "org_id = ${acme}" }
        - { where: "org_id = ${acme}", set: { org_id: "${globex}" }, expect: deny }   # nobody moves rows away
      delete: { rows: "org_id = ${acme}" }
    ben:
      insert:
        - { values: { org_id: "${acme}", name: "Hiring", is_public: true }, expect: allow }
      update: { set: { org_id: "${acme}" }, rows: "org_id = ${acme}" }
      delete: deny                              # only admins delete projects
    cleo:
      insert:
        - { values: { org_id: "${globex}", name: "Hiring" }, expect: allow }
        - { values: { org_id: "${acme}", name: "Hiring" }, expect: deny }
      update: { set: { org_id: "${globex}" }, rows: "org_id = ${globex}" }
      delete: { rows: "org_id = ${globex}" }

  tasks:
    ana:
      insert:
        - { values: { org_id: "${acme}", project_id: "${acme_roadmap}", title: "Plan", created_by: "${ana}" }, expect: allow }
        - { values: { org_id: "${acme}", project_id: "${acme_roadmap}", title: "Plan", created_by: "${ben}" }, expect: deny }
        - { values: { org_id: "${globex}", project_id: "${globex_launch}", title: "Plan", created_by: "${ana}" }, expect: deny }
      update:
        - { set: { org_id: "${acme}" }, rows: "org_id = ${acme}" }
        - { where: "org_id = ${acme}", set: { org_id: "${globex}" }, expect: deny }
      delete: { rows: "org_id = ${acme}" }      # admins delete any task of their organization
    ben:
      insert:
        - { values: { org_id: "${acme}", project_id: "${acme_roadmap}", title: "Plan", created_by: "${ben}" }, expect: allow }
        - { values: { org_id: "${acme}", project_id: "${acme_roadmap}", title: "Plan", created_by: "${ana}" }, expect: deny }
      update: { set: { org_id: "${acme}" }, rows: "org_id = ${acme}" }
      delete: { rows: "created_by = ${ben}" }   # members delete only their own tasks
    cleo:
      insert:
        - { values: { org_id: "${globex}", project_id: "${globex_launch}", title: "Plan", created_by: "${cleo}" }, expect: allow }
        - { values: { org_id: "${acme}", project_id: "${acme_roadmap}", title: "Plan", created_by: "${cleo}" }, expect: deny }
      update: { set: { org_id: "${globex}" }, rows: "org_id = ${globex}" }
      delete: { rows: "org_id = ${globex}" }
