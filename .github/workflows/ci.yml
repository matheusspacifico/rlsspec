name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  dist:
    name: dist plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Keep in step with cargo-dist-version in dist-workspace.toml. `dist plan` fails when
      # release.yml no longer matches the config: run `dist generate` instead of editing it by hand.
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
      - run: dist plan

  test:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "17"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
        env:
          INSTA_UPDATE: "no"
          RLSSPEC_PG_TAG: ${{ matrix.postgres }}

  example:
    name: example (multitenant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: docker compose -f examples/multitenant/docker-compose.yml up -d --wait
      # Any non-zero exit (failures or inconclusive cases) fails the job.
      - run: |
          ./target/debug/rlsspec test -c examples/multitenant/rlsspec.yaml
          ./target/debug/rlsspec lint -c examples/multitenant/rlsspec.yaml
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres

  docker:
    name: docker (build, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: rlsspec:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm rlsspec:ci version
      - run: docker compose -f examples/multitenant/docker-compose.yml up -d --wait
      # --network host: localhost is the runner's, so the database is local to rlsspec.
      - run: |
          docker run --rm --network host -v "$PWD/examples/multitenant:/work" -e DATABASE_URL rlsspec:ci test
          docker run --rm --network host -v "$PWD/examples/multitenant:/work" -e DATABASE_URL rlsspec:ci lint
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres

  action:
    name: action (multitenant)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: docker compose -f examples/multitenant/docker-compose.yml up -d --wait
      # No release to download yet: RLSSPEC_ACTION_BINARY makes the action use this build.
      - uses: ./
        id: green
        env:
          RLSSPEC_ACTION_BINARY: ${{ github.workspace }}/target/debug/rlsspec
        with:
          config: examples/multitenant/rlsspec.yaml
          format: junit
          output: reports/rlsspec.xml
      - uses: ./
        env:
          RLSSPEC_ACTION_BINARY: ${{ github.workspace }}/target/debug/rlsspec
        with:
          command: lint
          config: examples/multitenant/rlsspec.yaml
      - run: |
          test "${{ steps.green.outputs.exit-code }}" = 0
          grep -q '<testsuites name="rlsspec test" tests="89"' reports/rlsspec.xml
      - run: docker compose -f examples/multitenant/docker-compose.yml exec -T db psql -q -U postgres < examples/multitenant/broken.sql
      - uses: ./
        id: red
        continue-on-error: true
        env:
          RLSSPEC_ACTION_BINARY: ${{ github.workspace }}/target/debug/rlsspec
        with:
          config: examples/multitenant/rlsspec.yaml
          format: junit
          output: reports/broken.xml
      # The step fails on exit 1, after writing the report.
      - run: |
          test "${{ steps.red.outcome }}" = failure
          test "${{ steps.red.outputs.exit-code }}" = 1
          grep -q '<failure' reports/broken.xml
      # From a checkout, github.action_ref is not a release tag: without `version` the action refuses.
      - uses: ./
        id: unversioned
        continue-on-error: true
        with:
          config: examples/multitenant/rlsspec.yaml
      - run: test "${{ steps.unversioned.outcome }}" = failure

  supabase:
    name: supabase (preset + example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests that need the supabase/postgres image are #[ignore]d so plain `cargo test` never pulls it.
      - run: cargo test --locked --test supabase -- --ignored
        env:
          INSTA_UPDATE: "no"
      - run: cargo build --locked
      - run: docker compose -f examples/supabase-todo/docker-compose.yml up -d --wait
      # `unspecified: fail` in the spec: a gap exits 1 like a failure, and any non-zero exit fails the job.
      - run: |
          ./target/debug/rlsspec test -c examples/supabase-todo/rlsspec.yaml
          ./target/debug/rlsspec cover -c examples/supabase-todo/rlsspec.yaml
          ./target/debug/rlsspec lint -c examples/supabase-todo/rlsspec.yaml
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54330/postgres
