name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "17"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
        env:
          INSTA_UPDATE: "no"
          RLSSPEC_PG_TAG: ${{ matrix.postgres }}

  example:
    name: example (multitenant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: docker compose -f examples/multitenant/docker-compose.yml up -d --wait
      # Any non-zero exit (failures or inconclusive cases) fails the job.
      - run: |
          ./target/debug/rlsspec test -c examples/multitenant/rlsspec.yaml
          ./target/debug/rlsspec lint -c examples/multitenant/rlsspec.yaml
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres

  supabase:
    name: supabase (preset + example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests that need the supabase/postgres image are #[ignore]d so plain `cargo test` never pulls it.
      - run: cargo test --locked --test supabase -- --ignored
        env:
          INSTA_UPDATE: "no"
      - run: cargo build --locked
      - run: docker compose -f examples/supabase-todo/docker-compose.yml up -d --wait
      # `unspecified: fail` in the spec: a gap exits 1 like a failure, and any non-zero exit fails the job.
      - run: |
          ./target/debug/rlsspec test -c examples/supabase-todo/rlsspec.yaml
          ./target/debug/rlsspec cover -c examples/supabase-todo/rlsspec.yaml
          ./target/debug/rlsspec lint -c examples/supabase-todo/rlsspec.yaml
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:54330/postgres
