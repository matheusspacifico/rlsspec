version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the semver-compatible bumps; a new major version gets its own.
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # 2.x rejects blank keys (`vars:`, `expect:`…) that 1.x reads as empty; the upgrade is #7.
      - dependency-name: serde-saphyr
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # release.yml is generated by `dist generate` and never edited by hand (`dist plan` in CI fails
    # on drift): its action versions move with cargo-dist-version in dist-workspace.toml.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its tags are Rust toolchain versions (the msrv job pins rust-version), not action releases.
      - dependency-name: dtolnay/rust-toolchain
