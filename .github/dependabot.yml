version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the semver-compatible bumps; a new major version gets its own.
      cargo-minor:
        update-types: [minor, patch]
  # .github/workflows/release.yml is generated by `dist generate` and never edited by hand, so
  # an action bump that touches it has to be redone through dist (`dist plan` in CI fails on drift).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
